name: Update homepage

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at 17 minutes past
  workflow_dispatch:          # lets you run it from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Fetches all feeds, saves small local copies of the images, and writes site/data/news.json.
      # Failing feeds show up as warnings on the run; the build only fails if nothing at all came back.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # GitHub sometimes can't see the just-uploaded artifact for a few seconds; retry once.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in public repos after 60 days without activity.
      # Re-enabling the workflow on every run keeps the schedule alive.
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"

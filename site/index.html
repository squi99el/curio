<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Curio</title>
<meta name="application-name" content="Curio">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0f'/%3E%3Cpath d='M21.5 11.2A7.2 7.2 0 1 0 21.5 20.8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='22.6' cy='16' r='2.4' fill='%23c8102e'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/playfair-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Playfair Display"; src: url(fonts/playfair-display.woff2) format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
  @font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }

  /* ============ Design tokens: restyle the whole page from here ============ */
  :root {
    --font-display: "Playfair Display", ui-serif, Georgia, "Times New Roman", serif;
    --font-dek: "Newsreader", ui-serif, Georgia, serif;
    --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

    --bg: #eef1f5;
    --surface: #ffffff;
    --ink: #0d0d0f;
    --muted: #6b7280;
    --line: #dfe3ea;
    --accent: #c8102e;

    --radius: 18px;
    --gap: 18px;
    --maxw: 1320px;
    --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 8px 24px rgb(16 24 40 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d0f;
      --surface: #17181b;
      --ink: #f3f2ee;
      --muted: #9aa0a9;
      --line: #26282d;
      --accent: #ff4d6a;
      --shadow: none;
    }
  }

  /* ============ Base ============ */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ============ Top bar ============ */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 28px; padding-bottom: 20px; }
  .hello { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
  .brand { margin: 0; font: 800 1.9rem/1 var(--font-display); letter-spacing: -.04em; }
  .brand i { font-style: normal; color: var(--accent); }
  .hello .greet { font-weight: 600; font-size: .9rem; }
  .hello .date { color: var(--muted); font-size: .85rem; }
  .hello .stale { color: var(--accent); font-weight: 600; font-size: .8rem; }
  .search { position: relative; display: flex; align-items: center; }
  .search svg { position: absolute; left: 12px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search input { width: 180px; padding: 9px 14px 9px 38px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); font: inherit; font-size: .88rem; transition: width .2s ease, border-color .2s ease; }
  .search input:focus { width: 260px; border-color: var(--ink); outline: none; }
  .search input::placeholder { color: var(--muted); }

  /* ============ Hero: photo of the day ============ */
  .hero { position: relative; display: block; overflow: hidden; border-radius: calc(var(--radius) + 4px); background: #222; color: #fff; aspect-ratio: 21 / 9; min-height: 360px; box-shadow: var(--shadow); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }
  .hero:hover img { transform: scale(1.025); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / .72) 0%, rgb(0 0 0 / .28) 38%, rgb(0 0 0 / 0) 62%); }
  .hero .copy { position: absolute; z-index: 1; left: clamp(20px, 4vw, 48px); right: clamp(20px, 4vw, 48px); bottom: clamp(20px, 4vw, 44px); max-width: 880px; }
  .kicker { display: inline-flex; align-items: center; gap: 10px; font: 600 .72rem/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 14px; }
  .kicker::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
  .hero h2 { margin: 0; font: 700 clamp(1.9rem, 4.6vw, 3.8rem)/1.04 var(--font-display); letter-spacing: -.028em; text-wrap: balance; }
  .hero .dek { margin: 12px 0 0; max-width: 640px; font: italic 400 clamp(1rem, 1.6vw, 1.25rem)/1.4 var(--font-dek); opacity: .9; }
  .credit { position: absolute; z-index: 1; right: 16px; top: 14px; font-size: .7rem; padding: 5px 10px; border-radius: 99px; background: rgb(0 0 0 / .42); backdrop-filter: blur(6px); max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ============ Tabs ============ */
  .tabs { position: sticky; top: 0; z-index: 20; margin-top: 26px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .tabs .wrap { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab { flex: none; position: relative; padding: 14px 0 13px; border: 0; background: none; color: var(--muted); font-size: .95rem; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
  .tab[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }


  /* ============ Mobile topic menu (bottom sheet) ============ */
  .tabs .mbar { display: none; }
  .mbtn { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; padding: 9px 14px 9px 13px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-weight: 600; font-size: .92rem; }
  .mbtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mbtn svg { flex: none; width: 16px; height: 16px; opacity: .6; }
  .mcount { flex: none; color: var(--muted); font-size: .82rem; }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tone, var(--ink)); }
  dialog#sheet { border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: none; max-height: 84vh; border-radius: 24px 24px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -12px 48px rgb(0 0 0 / .3); overflow: hidden; }
  dialog#sheet[open] { display: flex; flex-direction: column; animation: slideup .28s cubic-bezier(.2,.8,.2,1); }
  dialog#sheet::backdrop { background: rgb(0 0 0 / .5); }
  @keyframes slideup { from { transform: translateY(60px); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; }
  .sheet-head h2 { margin: 0; font: 700 1.35rem/1.1 var(--font-display); letter-spacing: -.025em; }
  .sheet-close { border: 0; background: color-mix(in srgb, var(--ink) 8%, transparent); width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
  .sheet-list { padding: 6px 12px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 2px; overflow-y: auto; overscroll-behavior: contain; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px; border: 0; border-radius: 12px; background: none; text-align: left; font-size: 1rem; }
  .opt[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 8%, transparent); font-weight: 600; }
  .opt .n { margin-left: auto; color: var(--muted); font-size: .85rem; font-weight: 400; }
  .tabs .wrap.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); }

  /* ============ Feed ============ */
  .intro { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 24px 0 4px; }
  .intro:empty { display: none; }
  .intro h2 { margin: 0; font: 700 1.6rem/1.15 var(--font-display); letter-spacing: -.03em; }
  .intro p { margin: 0; color: var(--muted); font: italic 400 1.05rem/1.3 var(--font-dek); }
  .masonry { display: flex; gap: var(--gap); align-items: flex-start; padding-top: 16px; padding-bottom: 96px; }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }

  .card { position: relative; display: block; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; animation: rise .5s ease both; }
  .card:hover { transform: translateY(-3px); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .tag { display: inline-block; font: 600 .66rem/1 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; }
  .by { font: 500 .74rem/1.3 var(--font-ui); opacity: .8; }

  /* image cards: headline over a scrim, like the layout reference */
  .card.media { background: #2b2d31; color: #fff; }
  .card.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.6,.2,1); }
  .card.media:hover img { transform: scale(1.04); }
  .card.media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / .82) 0%, rgb(0 0 0 / .45) 34%, rgb(0 0 0 / 0) 66%); }
  .card.media .over { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
  .card.media .tag { color: #fff; display: inline-flex; align-items: center; gap: 8px; }
  .card.media .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
  .card.media h3 { margin: 0; font: 700 1.3rem/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }

  /* type cards: no image, so the headline is the picture */
  .card.type { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; background: var(--tone); color: var(--on-tone); }
  .card.type.light { background: var(--surface); color: var(--ink); }
  .card.type.light .tag { color: var(--tone-text); }
  .card.type h3 { margin: 0; font: 700 var(--hsize, 1.6rem)/1.08 var(--font-display); letter-spacing: -.03em; text-wrap: balance; }
  .card.type p { margin: 0; font: italic 400 1.02rem/1.4 var(--font-dek); opacity: .88; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card.type .by { margin-top: 2px; }

  .status { padding: 90px 0; text-align: center; color: var(--muted); font: italic 1.1rem var(--font-dek); }
  footer { border-top: 1px solid var(--line); padding: 24px 0 44px; color: var(--muted); font-size: .8rem; }
  footer a { text-decoration: underline; text-underline-offset: 3px; }

  /* ============ Small screens ============ */
  @media (max-width: 700px) {
    .wrap { padding: 0 16px; }
    .top { padding-top: 20px; }
    .search input, .search input:focus { width: 130px; }
    .search input:focus { width: 170px; }
    .hero { aspect-ratio: 4 / 5; min-height: 0; }
    #tabs { display: none; }
    .tabs .mbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
    .intro { flex-direction: column; gap: 4px; }
    :root { --gap: 12px; --radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card, .hero img, .card.media img { transition: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap top">
    <div class="hello"><h1 class="brand">Curio<i>.</i></h1><span class="greet" id="greeting">Hello</span><span class="date" id="date"></span><span class="stale" id="stale" hidden></span></div>
    <label class="search">
      <span class="sr">Search stories</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off">
    </label>
  </div>

  <div class="wrap" id="heroSlot"></div>

  <nav class="tabs" aria-label="Topics">
    <div class="wrap" id="tabs"></div>
    <div class="wrap mbar">
      <button class="mbtn" id="filterBtn" type="button" aria-haspopup="dialog">
        <span class="dot" id="filterDot"></span><span class="name" id="filterLabel">All stories</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="mcount" id="filterCount"></span>
    </div>
  </nav>

  <dialog id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Topics</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="Close">✕</button></div>
    <div class="sheet-list" id="sheetList"></div>
  </dialog>

  <main class="wrap">
    <div class="intro" id="intro"></div>
    <noscript><p class="status">This page needs JavaScript to show your news.</p></noscript>
    <div class="masonry" id="masonry" aria-live="polite"><p class="status" style="width:100%">Loading…</p></div>
  </main>

  <footer><div class="wrap" id="foot">Refreshed automatically every few hours. Edit <code>feeds.json</code> to change topics and sources.</div></footer>

<script>
(() => {
  "use strict";
  const STALE_HOURS = 12;
  const MIN_COL = 280;
  const RATIOS = [[4, 5], [1, 1], [3, 4], [5, 4], [4, 5], [3, 4]]; // varied image-card shapes for a staggered grid

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v);
    }
    n.append(...kids);
    return n;
  };
  const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : ""; } catch { return ""; } };
  // Images are mirrored into img/ at build time; anything else must be https.
  const safeImg = (u) => (/^img\/[\w-]+\.webp$/.test(u || "") ? u : safeUrl(u));
  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
  const isLight = (hex) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return false;
    const n = parseInt(m[1], 16);
    const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
    return .2126 * r + .7152 * g + .0722 * b > .35;
  };

  function ago(iso) {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (!isFinite(s)) return "";
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
    if (s < 86400) return Math.round(s / 3600) + "h ago";
    const d = Math.round(s / 86400);
    return d < 14 ? d + "d ago" : Math.round(d / 7) + "w ago";
  }

  /* ---------- masthead + hero ---------- */
  function masthead(generatedAt) {
    const now = new Date(), h = now.getHours();
    $("greeting").textContent = h < 5 ? "Still up?" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    if (generatedAt && (Date.now() - Date.parse(generatedAt)) / 3.6e6 > STALE_HOURS) {
      $("stale").hidden = false;
      $("stale").textContent = "Last updated " + ago(generatedAt) + ", so some feeds may be failing";
    }
  }

  function renderHero(hero) {
    const slot = $("heroSlot");
    const url = safeUrl(hero?.url), img = safeImg(hero?.image);
    if (!url || !img) return;
    const small = safeImg(hero.imageSmall);
    const pic = el("img", { src: img, alt: hero.title, fetchpriority: "high", referrerpolicy: "no-referrer", decoding: "async" });
    if (small && small !== img) { pic.setAttribute("srcset", `${small} 1280w, ${img} 1920w`); pic.setAttribute("sizes", "(max-width: 1400px) 100vw, 1320px"); }
    pic.addEventListener("error", () => slot.replaceChildren());
    const copy = el("div", { class: "copy" }, [el("div", { class: "kicker", text: "Photo of the day" }), el("h2", { text: hero.title })]);
    if (hero.dek) copy.append(el("p", { class: "dek", text: hero.dek }));
    const credit = [hero.credit && "Photo: " + hero.credit, hero.license, hero.credit === "Wikimedia Commons" ? "" : "Wikimedia Commons"].filter(Boolean).join(" · ");
    const a = el("a", { class: "hero", href: url, target: "_blank", rel: "noopener noreferrer", "aria-label": "Photo of the day: " + hero.title }, [pic, copy, el("span", { class: "credit", text: credit })]);
    slot.replaceChildren(a);
  }

  /* ---------- cards ---------- */
  function mediaCard(item, topic, ratio) {
    const a = el("a", { class: "card media", href: item._url, target: "_blank", rel: "noopener noreferrer" });
    a.style.aspectRatio = ratio.join(" / ");
    a.style.setProperty("--tone", topic.color || "#888");
    const img = el("img", { src: item._img, alt: "", loading: "lazy", decoding: "async", referrerpolicy: "no-referrer" });
    img.addEventListener("error", () => { const t = typeCard(item, topic); a.replaceWith(t); item._node = t; });
    a.append(img, el("div", { class: "over" }, [
      el("span", { class: "tag", text: topic.title }),
      el("h3", { text: item.title }),
      el("span", { class: "by", text: [item.source, item.published && ago(item.published)].filter(Boolean).join(" · ") }),
    ]));
    return a;
  }

  function typeCard(item, topic) {
    const h = hash(item.url);
    const light = h % 3 === 0;
    const a = el("a", { class: "card type" + (light ? " light" : ""), href: item._url, target: "_blank", rel: "noopener noreferrer" });
    const tone = topic.color || "#333";
    a.style.setProperty("--tone", tone);
    a.style.setProperty("--tone-text", isLight(tone) ? "#8a5a00" : tone);
    a.style.setProperty("--on-tone", isLight(tone) ? "#15110a" : "#fff");
    const len = item.title.length;
    a.style.setProperty("--hsize", len < 55 ? "2rem" : len < 95 ? "1.65rem" : "1.35rem");
    a.append(
      el("span", { class: "tag", text: topic.title }),
      el("h3", { text: item.title }),
    );
    if (item.summary) a.append(el("p", { text: item.summary }));
    a.append(el("span", { class: "by", text: [item.source, item.published && ago(item.published)].filter(Boolean).join(" · ") }));
    return a;
  }

  function cardFor(item, topic) {
    if (item._node) return item._node;
    const h = hash(item.url);
    const ratio = RATIOS[h % RATIOS.length];
    item._ratio = ratio;
    item._node = item._img ? mediaCard(item, topic, ratio) : typeCard(item, topic);
    return item._node;
  }

  /* ---------- masonry ---------- */
  // Estimated height lets us balance columns before images have loaded, while keeping reading order.
  function estimate(item, colW) {
    if (item._img && item._ratio) return colW * item._ratio[1] / item._ratio[0];
    const chars = Math.max(8, (colW - 44) / (item.title.length < 55 ? 15 : 11));
    return 120 + Math.ceil(item.title.length / chars) * (item.title.length < 55 ? 34 : 26) + (item.summary ? 90 : 0);
  }

  let current = [], lastCols = 0;
  function layout(force) {
    const box = $("masonry");
    const width = box.clientWidth || document.documentElement.clientWidth;
    const gap = parseFloat(getComputedStyle(box).columnGap) || 18;
    const cols = Math.max(1, Math.min(5, Math.floor((width + gap) / (MIN_COL + gap))));
    if (!force && cols === lastCols) return;
    lastCols = cols;
    const colW = (width - gap * (cols - 1)) / cols;
    const columns = Array.from({ length: cols }, () => el("div", { class: "col" }));
    const heights = new Array(cols).fill(0);
    for (const { item, topic } of current) {
      let c = heights.indexOf(Math.min(...heights));
      const node = cardFor(item, topic);
      columns[c].append(node);
      heights[c] += estimate(item, colW) + gap;
    }
    box.replaceChildren(...columns);
  }

  /* ---------- state: filter, search ---------- */
  let all = [], topics = [], active = "all", query = "";

  // "All" interleaves topics (one story from each in turn) so no subject clumps together.
  function interleave(groups) {
    const out = [];
    for (let i = 0; groups.some((g) => i < g.length); i++) for (const g of groups) if (i < g.length) out.push(g[i]);
    return out;
  }

  function refresh() {
    const q = query.trim().toLowerCase();
    const match = ({ item }) => !q || `${item.title} ${item.summary} ${item.source}`.toLowerCase().includes(q);
    let list;
    if (active === "all") list = interleave(topics.map((t) => all.filter((x) => x.topic.id === t.id)));
    else list = all.filter((x) => x.topic.id === active);
    current = list.filter(match);

    const t = topics.find((x) => x.id === active);
    $("intro").replaceChildren(...(t ? [el("h2", { text: t.title }), el("p", { text: t.blurb })] : []));

    document.querySelectorAll(".tab, .opt").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === active)));
    document.querySelector('.tab[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
    $("filterLabel").textContent = t ? t.title : "All stories";
    $("filterDot").style.setProperty("--tone", t?.color || "var(--ink)");
    $("filterCount").textContent = current.length + (current.length === 1 ? " story" : " stories");
    if (!current.length) {
      $("masonry").replaceChildren(el("p", { class: "status", style: "width:100%", text: q ? "Nothing matches “" + query + "”." : "No stories yet." }));
      lastCols = 0;
      return;
    }
    layout(true);
  }

  function setActive(id, push = true) {
    active = id;
    if (push) { try { history.replaceState(null, "", id === "all" ? location.pathname + location.search : "#" + id); } catch { /* sandboxed preview frames may refuse */ } }
    refresh();
  }

  function jumpToFeed() {
    // After choosing a topic, bring the top of the feed into view under the sticky bar.
    const heroBottom = $("heroSlot").getBoundingClientRect().bottom + window.scrollY + 26;
    if (window.scrollY > heroBottom) window.scrollTo({ top: heroBottom, behavior: "smooth" });
  }

  function renderTabs() {
    const tabs = $("tabs"), list = $("sheetList");
    const counts = Object.fromEntries(topics.map((t) => [t.id, all.filter((x) => x.topic.id === t.id).length]));
    const choose = (id) => () => { setActive(id); jumpToFeed(); };

    const tab = (id, label) => { const b = el("button", { class: "tab", type: "button", "data-id": id, "aria-pressed": "false", text: label }); b.addEventListener("click", choose(id)); return b; };
    tabs.replaceChildren(tab("all", "All"), ...topics.map((t) => tab(t.id, t.title)));
    const fade = () => tabs.classList.toggle("fade-r", tabs.scrollWidth - tabs.clientWidth - tabs.scrollLeft > 6);
    tabs.addEventListener("scroll", fade, { passive: true });
    window.addEventListener("resize", fade);
    fade();

    const opt = (id, label, n, color) => {
      const b = el("button", { class: "opt", type: "button", "data-id": id, "aria-pressed": "false" }, [
        el("span", { class: "dot" }), el("span", { text: label }), el("span", { class: "n", text: String(n) }),
      ]);
      b.querySelector(".dot").style.setProperty("--tone", color || "var(--ink)");
      b.addEventListener("click", () => { $("sheet").close(); choose(id)(); });
      return b;
    };
    list.replaceChildren(opt("all", "All stories", all.length), ...topics.map((t) => opt(t.id, t.title, counts[t.id], t.color)));

    const sheet = $("sheet");
    $("filterBtn").addEventListener("click", () => { sheet.showModal(); list.querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: "center" }); });
    $("sheetClose").addEventListener("click", () => sheet.close());
    sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); }); // tap on the dimmed backdrop
  }

  function init(data) {
    masthead(data.generatedAt);
    renderHero(data.hero);
    topics = data.topics.filter((t) => t.items.length);
    all = topics.flatMap((t) => t.items.map((item) => {
      item._url = safeUrl(item.url);
      item._img = safeImg(item.image);
      return { item, topic: t };
    })).filter((x) => x.item._url);
    renderTabs();

    const fromHash = decodeURIComponent(location.hash.slice(1));
    active = topics.some((t) => t.id === fromHash) ? fromHash : "all";
    refresh();

    const n = all.length;
    $("foot").textContent = `${n} stories from ${new Set(all.map((x) => x.item.source)).size} sources, updated ${ago(data.generatedAt)}. Hero photos from Wikimedia Commons. Edit feeds.json to change topics and sources.`;

    let timer;
    $("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { query = e.target.value; refresh(); }, 120); });
    document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } if (e.key === "Escape") { $("q").blur(); } });
    window.addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); setActive(topics.some((t) => t.id === id) ? id : "all", false); });
    let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (current.length) layout(false); }, 150); });
  }

  fetch("data/news.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(init)
    .catch((e) => {
      masthead(null);
      $("masonry").replaceChildren(el("p", { class: "status", style: "width:100%", text: "Couldn’t load the news data (" + e.message + "). If you’re opening this file directly, run it from a local server instead: npm run serve" }));
    });
})();
</script>
</body>
</html>
